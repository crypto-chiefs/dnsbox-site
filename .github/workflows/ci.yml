name: Site checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: yarn
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn run check
      - name: Check committed site output
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - name: Check shipped server and HTTP responses
        run: |
          PORT=18763 ./app &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18763/ > /dev/null && break
            sleep 0.2
          done
          node scripts/check-site.mjs http://127.0.0.1:18763
      - run: go vet main.go
      - run: go test -race main.go main_test.go
      - name: Build Linux server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/dnsbox-site main.go
